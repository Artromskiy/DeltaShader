name: Build, tests and benchmarks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run registered BenchmarkDotNet projects
        required: true
        default: false
        type: boolean
      filter:
        description: BenchmarkDotNet filter
        required: true
        default: "*"
        type: string
      warmup_count:
        required: true
        default: 3
        type: number
      iteration_count:
        required: true
        default: 5
        type: number
      launch_count:
        required: true
        default: 1
        type: number

permissions:
  contents: read
  packages: read

concurrency:
  group: delta-shader-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout DeltaShader
        uses: actions/checkout@v7
        with:
          path: DeltaShader
      - name: Checkout DeltaMaths
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaMaths
          path: DeltaMaths
      - name: Checkout DeltaRender
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaRender
          path: DeltaRender
      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Configure GitHub Packages
        working-directory: DeltaShader
        run: |
          dotnet nuget add source \
            https://nuget.pkg.github.com/Artromskiy/index.json \
            --name github-artromskiy \
            --username "${{ github.repository_owner }}" \
            --password "${{ github.token }}" \
            --store-password-in-clear-text
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: delta-shader-nuget-${{ runner.os }}-${{ hashFiles('DeltaShader/**/*.csproj', 'DeltaMaths/**/*.csproj', 'DeltaRender/**/*.csproj') }}
          restore-keys: delta-shader-nuget-${{ runner.os }}-
      - name: Install Vulkan and SPIR-V tools
        run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-tools mesa-vulkan-drivers
      - name: Bootstrap restore
        working-directory: DeltaShader
        run: |
          set -euo pipefail
          dotnet restore ../DeltaMaths/src/DeltaMaths/DeltaMaths.csproj
          for project in \
            src/DeltaShader.Contract/DeltaShader.Contract.csproj \
            src/DeltaShader.Compiler/DeltaShader.Compiler.csproj \
            src/DeltaShader.Analyzers/DeltaShader.Analyzers.csproj \
            src/DeltaShader.Tool/DeltaShader.Tool.csproj; do
            dotnet restore "$project" --verbosity minimal
          done
      - name: Pack current DeltaShader toolchain
        working-directory: DeltaShader
        shell: bash
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/deltashader-nuget"
          mkdir -p "$feed"
          dotnet restore ../DeltaMaths/src/DeltaMaths/DeltaMaths.csproj
          dotnet pack ../DeltaMaths/src/DeltaMaths/DeltaMaths.csproj -c Release --no-restore \
            --output "$feed" \
            --verbosity minimal
          for project in \
            src/DeltaShader.Contract/DeltaShader.Contract.csproj \
            src/DeltaShader.Compiler/DeltaShader.Compiler.csproj \
            src/DeltaShader.Analyzers/DeltaShader.Analyzers.csproj \
            src/DeltaShader.Tool/DeltaShader.Tool.csproj; do
            dotnet pack "$project" -c Release --no-restore \
              -p:PackageVersion=0.0.25 \
              --output "$feed" \
              --verbosity minimal
          done
          cat > "$RUNNER_TEMP/deltashader-nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
            <clear />
            <add key="deltashader-ci" value="$feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="deltashader-ci">
                <package pattern="DeltaMaths" />
                <package pattern="DeltaShader.*" />
                <package pattern="DeltaRender" />
              </packageSource>
              <packageSource key="github-artromskiy">
                <package pattern="DeltaText" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          dotnet nuget add source \
            https://nuget.pkg.github.com/Artromskiy/index.json \
            --name github-artromskiy \
            --username "${{ github.repository_owner }}" \
            --password "${{ github.token }}" \
            --store-password-in-clear-text \
            --configfile "$RUNNER_TEMP/deltashader-nuget.config"
      - name: Restore with current DeltaShader toolchain
        working-directory: DeltaShader
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(find src samples tests -type f -name '*.csproj' \
            ! -path '*/DeltaShader.Vulkan.Tests/*' \
            ! -path '*/DeltaShader.TestShaders/*' | sort)
          for project in "${projects[@]}"; do
            dotnet restore "$project" \
              --configfile "$RUNNER_TEMP/deltashader-nuget.config" \
              --verbosity minimal
          done
      - name: Build shader projects
        working-directory: DeltaShader
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(find src samples tests -type f -name '*.csproj' \
            ! -path '*/DeltaShader.Vulkan.Tests/*' \
            ! -path '*/DeltaShader.TestShaders/*' | sort)
          for project in "${projects[@]}"; do
            dotnet build "$project" -c Release --no-restore \
              --disable-build-servers -m:1 /p:UseSharedCompilation=false
          done
      - name: Run tests
        working-directory: DeltaShader
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/DeltaShader.Compiler.Tests/DeltaShader.Compiler.Tests.csproj \
            -c Release --no-build --no-restore --disable-build-servers -m:1 \
            /p:UseSharedCompilation=false \
            --filter 'FullyQualifiedName!~ShadertoyGalleryTests'
          dotnet test tests/DeltaShader.Golden.Tests/DeltaShader.Golden.Tests.csproj \
            -c Release --no-build --no-restore --disable-build-servers -m:1 \
            /p:UseSharedCompilation=false
          perl -e 'alarm 60; exec @ARGV' -- \
            dotnet test tests/DeltaShader.Compiler.Tests/DeltaShader.Compiler.Tests.csproj \
              -c Release --no-build --no-restore --disable-build-servers -m:1 \
              /p:UseSharedCompilation=false \
              --filter 'FullyQualifiedName~ShadertoyGalleryTests'
      - name: Benchmark discovery smoke
        working-directory: DeltaShader
        shell: bash
        run: |
          mapfile -t projects < <(find . -type f -name '*.Benchmarks.csproj' | sort)
          for project in "${projects[@]}"; do
            dotnet run --project "$project" -c Release -- --list flat --filter '*'
          done

  benchmarks:
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout DeltaShader
        uses: actions/checkout@v7
        with:
          path: DeltaShader
      - name: Checkout DeltaMaths
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaMaths
          path: DeltaMaths
      - name: Checkout DeltaRender
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaRender
          path: DeltaRender
      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run registered benchmarks
        working-directory: DeltaShader
        shell: bash
        run: |
          mkdir -p artifacts/benchmarks
          mapfile -t projects < <(find . -type f -name '*.Benchmarks.csproj' | sort)
          if [ ${#projects[@]} -eq 0 ]; then
            echo 'No *.Benchmarks.csproj is registered.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for project in "${projects[@]}"; do
            dotnet run --project "$project" -c Release -- \
              --filter '${{ inputs.filter }}' \
              --warmupCount '${{ inputs.warmup_count }}' \
              --iterationCount '${{ inputs.iteration_count }}' \
              --launchCount '${{ inputs.launch_count }}' \
              --exporters json csv markdown github \
              --artifacts artifacts/benchmarks
          done
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delta-shader-benchmarks-${{ github.run_number }}
          path: DeltaShader/artifacts/benchmarks
          if-no-files-found: warn
          retention-days: 30
